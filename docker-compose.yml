version: '3.8'

services:
  sparkle:
    build: .
    container_name: sparkle-honeypot
    ports:
      - "5000:5000"
    volumes:
      - ./honeypot_logs:/sparkle/honeypot_logs
      - ./sparkle_config.json:/sparkle/sparkle_config.json
    environment:
      SPARKLE_PORT: 5000
      SPARKLE_DEBUG: "false"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
