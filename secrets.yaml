# =============================================================================
# Sparkle - Fake Secrets Definition
# =============================================================================
# Realistic secret templates for a production LLM / LLM-agent deployment.
# Edit, add, or remove entries below — no code changes needed.
#
# Placeholders available in `template`:
#   {random_hexN}    - N-character random hex string   e.g. {random_hex32}
#   {random_upperN}  - N-character random UPPERCASE     e.g. {random_upper16}
#   {random_lowerN}  - N-character random lowercase     e.g. {random_lower10}
#   {random_base64}  - urlsafe base64 token
#   {random_uuid}    - a random UUID4
#   {password}       - a password-shaped string
#   {random_word}    - a themed codeword
#   {random_number}  - a random number (0-9999)
#   {octet}          - a random 0-255 IP octet
#   {payload}        - fake JWT payload segment
#   {signature}      - fake JWT signature segment
#   {key_data}       - multi-line fake key block
#
# Runtime override:
#   Set SPARKLE_SECRETS_FILE=/path/to/your.yaml to point Sparkle at a
#   different file without touching any code. See sparkle_config.json
#   for the same option under "secrets_file".
# =============================================================================

secrets:
  - type: openai_api_key
    display: "OpenAI API Key"
    template: "sk-proj-{random_base64}"

  - type: anthropic_api_key
    display: "Anthropic API Key"
    template: "sk-ant-api03-{random_base64}"

  - type: azure_openai_key
    display: "Azure OpenAI Resource Key"
    template: "{random_hex32}"

  - type: cohere_api_key
    display: "Cohere API Key"
    template: "{random_base64}"

  - type: huggingface_token
    display: "Hugging Face Access Token"
    template: "hf_{random_hex24}"

  - type: langsmith_api_key
    display: "LangSmith API Key"
    template: "lsv2_pt_{random_hex32}"

  - type: pinecone_api_key
    display: "Pinecone Vector DB API Key"
    template: "{random_uuid}"

  - type: weaviate_api_key
    display: "Weaviate Cloud API Key"
    template: "{random_base64}"

  - type: qdrant_api_key
    display: "Qdrant Cloud API Key"
    template: "{random_hex32}.{random_hex8}"

  - type: wandb_api_key
    display: "Weights & Biases API Key"
    template: "{random_hex40}"

  - type: vector_db_url
    display: "Vector DB Endpoint"
    template: "https://{random_lower10}-index.svc.{random_lower6}.pinecone.io"

  - type: model_serving_endpoint
    display: "Internal Model Serving Endpoint"
    template: "https://inference-{random_lower6}.internal.corp:8443/v1/completions"

  - type: agent_memory_redis
    display: "Agent Memory Store (Redis) Connection"
    template: "redis://default:{password}@agent-memory-prod.internal:6379/0"

  - type: agent_orchestrator_token
    display: "Workflow Orchestrator Token"
    template: "temporal_{random_hex32}"

  - type: tool_search_api_key
    display: "Search Tool API Key"
    template: "srp_{random_hex24}"

  - type: code_sandbox_token
    display: "Code Execution Sandbox Token"
    template: "sbx_{random_hex32}"

  - type: webhook_signing_secret
    display: "Agent Webhook Signing Secret"
    template: "whsec_{random_base64}"

  - type: mcp_server_token
    display: "MCP Server Auth Token"
    template: "mcp_{random_hex32}"

  - type: model_registry_token
    display: "Internal Model Registry Token"
    template: "reg_{random_hex24}"

  - type: finetune_job_credential
    display: "Fine-tuning Job Credential"
    template: "ft-{random_hex16}:{random_hex16}"

  - type: guardrails_api_key
    display: "Guardrails / Eval Service API Key"
    template: "grd_{random_hex24}"

  - type: aws_bedrock_key
    display: "AWS Bedrock Access Key"
    template: "AKIA{random_upper16}"

  - type: gcp_vertex_service_account
    display: "GCP Vertex AI Service Account"
    template: "vertex-agent@{random_lower8}.iam.gserviceaccount.com"

  - type: internal_admin_username
    display: "Internal Admin Account"
    template: "admin_{random_lower8}"

  - type: internal_agent_ip
    display: "Internal Agent Host IP"
    template: "10.{octet}.{octet}.{octet}"

  - type: jwt_agent_token
    display: "Agent Session JWT"
    template: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.{payload}.{signature}"

  - type: ssh_deploy_key
    display: "SSH Deploy Key"
    template: |-
      -----BEGIN OPENSSH PRIVATE KEY-----
      {key_data}
      -----END OPENSSH PRIVATE KEY-----
