version: '3.8'

services:
  sparkle:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sparkle-honeypot
    ports:
      - "5000:5000"
    volumes:
      - ./honeypot_logs:/sparkle/honeypot_logs
      - ./sparkle_config.json:/sparkle/sparkle_config.json
    environment:
      SPARKLE_PORT: 5000
      SPARKLE_DEBUG: "false"
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    command: python sparkle_openai_compat.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - sparkle-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui-sparkle
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      # Pre-configure Sparkle as an OpenAI-compatible connection
      # This auto-connects on startup - no manual setup needed
      - OPENAI_API_BASE_URLS=http://sparkle:5000/v1
      - OPENAI_API_KEYS=sk-no-key-required
      - ENABLE_OPENAI_API=true
      - WEBUI_AUTH=false
      - ENABLE_OLLAMA_API=false
    restart: unless-stopped
    networks:
      - sparkle-network
    depends_on:
      sparkle:
        condition: service_healthy

networks:
  sparkle-network:
    driver: bridge

volumes:
  open-webui-data:
  