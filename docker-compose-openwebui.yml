version: '3.8'

services:
  sparkle:
    build: .
    container_name: sparkle-honeypot
    ports:
      - "5000:5000"
    volumes:
      - ./honeypot_logs:/sparkle/honeypot_logs
      - ./sparkle_config.json:/sparkle/sparkle_config.json
    environment:
      SPARKLE_PORT: 5000
      SPARKLE_DEBUG: "false"
      PYTHONUNBUFFERED: 1
    restart: unless-stopped
    command: python sparkle_openai_compat.py
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 5s
    networks:
      - sparkle-network

  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: open-webui-sparkle
    ports:
      - "3000:8080"
    volumes:
      - open-webui-data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://localhost:11434
      - WEBUI_AUTH=false
    restart: unless-stopped
    networks:
      - sparkle-network
    depends_on:
      - sparkle

networks:
  sparkle-network:
    driver: bridge

volumes:
  open-webui-data:
